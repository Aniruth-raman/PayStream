spring:
  application:
    name: PaymentIngestor
  datasource:
    url: jdbc:h2:mem:payment_ingestor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all # Wait for broker acknowledgement so the ingest path only accepts records after durable broker write intent.
      linger-ms: 5 # Small batching window to keep hackathon throughput decent without adding noticeable latency.
      compression-type: snappy # Light compression keeps producer payloads smaller and reduces network overhead.
      properties:
        enable.idempotence: true # Prevents duplicate publishes on retries when the broker or network is flaky.
        spring.json.add.type.headers: false # Keep the event payload clean for downstream consumers that rely on a shared contract.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      enabled: true



